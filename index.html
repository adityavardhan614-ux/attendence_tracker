<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Tracker - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-center">
    <div class="card login-card">
      <h1>Student Login</h1>
      <p>Enter your Student ID and password to continue.</p>

      <label for="studentId">Student ID</label>
      <input id="studentId" type="text" placeholder="Enter Student ID" />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter Password" />

      <button id="loginBtn">Login</button>

      <p class="note">Hint: any non-empty Student ID and Password will work.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
